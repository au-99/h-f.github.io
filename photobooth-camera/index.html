<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#112130">
  <meta name="description" content="Photobooth Hana & Fiqri">
  <title>Hana & Fiqri · Photobooth</title>
  <link rel="stylesheet" href="styles.css?v=20261106-1">
  <script defer src="config.js?v=20261106-1"></script>
  <script defer src="app.js?v=20261106-1"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7.5h4l1.5-2h7l1.5 2h4v11H3z"/><circle cx="12" cy="13" r="3.2"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-13-2L5 8m0-4v4h4M4 16a8 8 0 0 0 13 2l2-2m0 4v-4h-4"/><path d="M9 10h6v5H9z"/></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.3"/><path d="m5 17 5-5 3.5 3.4 2.5-2.4 3 4"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18m3-6 2-2 2 2 2-2 2 3"/><circle cx="14" cy="8" r="1.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v3h16v-3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 3 6m-3-1v-5h5"/></symbol>
  </svg>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><strong>Hana & Fiqri</strong><small>PHOTOBOOTH · 14.11.2026</small></span></div>
      <div class="top-actions">
        <button id="language" class="top-button language" type="button" aria-label="Switch to English">EN</button>
        <button id="openAlbum" class="top-button album-button" type="button" aria-label="Album saya"><svg><use href="#i-album"/></svg><span data-text="album">Album</span><span id="albumCount" class="count" hidden>0</span></button>
      </div>
    </header>

    <div class="viewfinder-area">
      <div class="viewfinder" id="viewfinder">
        <canvas id="composition" width="1080" height="1920" role="img" aria-label="Pratonton kamera dan bingkai"></canvas>
        <video id="cameraVideo" playsinline autoplay muted hidden></video>
        <div class="camera-welcome" id="cameraWelcome">
          <span class="welcome-icon"><svg><use href="#i-camera"/></svg></span>
          <strong data-text="cameraTitle">Sedia untuk bergambar?</strong>
          <button id="startCamera" class="pill light" type="button" data-text="openCamera">Buka kamera</button>
          <small data-text="cameraHelp">Benarkan akses kamera untuk mula.</small>
          <button id="nativeCamera" class="native-camera" type="button" data-text="phoneCamera">Kamera telefon</button>
        </div>
        <div class="stage-top"><span id="frameName">FRAME 09</span><span id="progress">1 / 1</span></div>
        <div class="stage-bottom" id="stageMessage" role="status" aria-live="polite"></div>
      </div>
    </div>

    <section class="frame-section" aria-label="Pilih bingkai" id="frameSection">
      <div class="section-top"><div><span class="sparkle">✳</span><strong data-text="frames">Pilih bingkai</strong><small data-text="swipe">Leret untuk pilih</small></div><span id="frameType">1 FOTO</span></div>
      <div id="frames" class="frames" role="group" aria-label="Bingkai"></div>
    </section>

    <div class="controls" id="captureControls">
      <button id="choosePhoto" class="side-control" type="button"><span class="control-circle"><svg><use href="#i-gallery"/></svg></span><small data-text="gallery">Galeri</small></button>
      <button id="capture" class="shutter" type="button" aria-label="Ambil foto" disabled><span></span></button>
      <button id="flip" class="side-control" type="button"><span class="control-circle"><svg><use id="flipIcon" href="#i-flip"/></svg></span><small id="flipLabel">Tukar</small></button>
    </div>
    <div class="review-controls" id="reviewControls" hidden>
      <button class="pill ghost" type="button" id="retake"><svg><use href="#i-repeat"/></svg><span data-text="retake">Ambil semula</span></button>
      <button class="pill primary" type="button" id="save"><svg><use href="#i-upload"/></svg><span data-text="save">Simpan</span></button>
    </div>
    <div class="shot-tabs" id="shotTabs" aria-label="Pilih foto untuk diambil semula" hidden></div>
    <p class="bottom-note" id="bottomNote" role="status" aria-live="polite"></p>
  </main>

  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="nativeInput" type="file" accept="image/*" capture="user" hidden>
  <input id="mediaInput" type="file" accept="image/*,video/*" hidden>
  <div class="sheet-backdrop" id="albumBackdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading"><div><span class="overline" data-text="memories">KENANGAN KITA</span><h1 id="albumTitle" data-text="myAlbum">Album saya</h1></div><button id="closeAlbum" class="icon-button" type="button" aria-label="Tutup"><svg><use href="#i-close"/></svg></button></div>
      <p class="sheet-copy" data-text="albumHelp">Foto dan video yang anda kongsi dalam sesi ini.</p>
      <button id="chooseMedia" class="upload-tile" type="button"><span><svg><use href="#i-gallery"/></svg></span><span><strong data-text="uploadMedia">Kongsi foto / video</strong><small data-text="uploadHint">Pilih dari telefon · video maks. 24 MB</small></span><b aria-hidden="true">＋</b></button>
      <div id="mediaSelected" class="media-selected" hidden><img id="mediaImage" alt="" hidden><video id="mediaVideo" playsinline controls hidden></video><small id="mediaName"></small><button id="sendMedia" class="pill primary" type="button"><svg><use href="#i-upload"/></svg><span data-text="send">Hantar ke album</span></button></div>
      <p id="albumStatus" class="album-status" role="status" aria-live="polite" hidden></p>
      <div class="album-heading"><strong data-text="yourUploads">Muat naik anda</strong><small data-text="privateNote">Hanya anda boleh padam</small></div>
      <p id="albumEmpty" class="empty" data-text="empty">Belum ada foto atau video.</p>
      <div id="albumList" class="album-list"></div>
    </section>
  </div>
</body>
</html>
