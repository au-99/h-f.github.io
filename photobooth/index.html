<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e7f1fa">
    <meta name="description" content="Photobooth majlis Hana & Fiqri — ambil gambar, pilih bingkai dan simpan kenangan.">
    <title>Photobooth Hana & Fiqri</title>
    <link rel="stylesheet" href="styles.css?v=2026-10-17-2">
    <script defer src="config.js?v=2026-10-17-3"></script>
    <script defer src="app.js?v=2026-10-17-3"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy"><strong>Hana & Fiqri</strong><span>PHOTOBOOTH · 14.11.2026</span></div>
        <button class="language-toggle" id="languageToggle" type="button" aria-label="Switch to English" title="Switch to English">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.5 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.5-4-9s1.4-6.5 4-9Z"/></svg>
          <span id="languageLabel">EN</span>
        </button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow" data-i18n="heroEyebrow">KENANGAN HARI BAHAGIA</p>
        <h1 id="intro-title" data-i18n="heroTitle">Satu foto, seribu kenangan.</h1>
        <a class="button button-primary intro-cta" href="#pilih-bingkai"><span data-i18n="start">Mula</span><span aria-hidden="true">↗</span></a>
        <div class="intro-flowers" aria-hidden="true">✿ &nbsp; ❀ &nbsp; ✿</div>
      </section>

      <section class="section-wrap chooser" id="pilih-bingkai" aria-labelledby="frame-title">
        <div class="section-heading">
          <p class="eyebrow">01 / 02</p>
          <h2 id="frame-title" data-i18n="chooseFrame">Pilih bingkai</h2>
        </div>
        <div class="filter-row" role="group" aria-label="Jenis bingkai">
          <button class="filter is-active" type="button" data-filter="all" aria-pressed="true" data-i18n="all">Semua</button>
          <button class="filter" type="button" data-filter="collage" aria-pressed="false" data-i18n="collageShort">4 foto</button>
          <button class="filter" type="button" data-filter="portrait" aria-pressed="false" data-i18n="portraitShort">1 foto</button>
          <button class="filter" type="button" data-filter="full" aria-pressed="false" data-i18n="fullShort">Foto penuh</button>
        </div>
        <div class="frame-grid" id="frameGrid"></div>
      </section>

      <section class="section-wrap studio" id="studio" aria-labelledby="studio-title">
        <div class="section-heading">
          <p class="eyebrow">02 / 02</p>
          <h2 id="studio-title" data-i18n="takePhoto">Ambil foto</h2>
          <p id="studioHint">Pilih bingkai.</p>
        </div>
        <div class="studio-layout">
          <div class="stage-wrap">
            <div class="stage">
              <canvas id="composition" width="1080" height="1920" role="img" aria-label="Pratonton foto dengan bingkai pilihan"></canvas>
              <video id="liveVideo" class="live-source" autoplay muted playsinline aria-hidden="true"></video>
              <div class="stage-loading" id="stageLoading" data-i18n="loading">Memuatkan…</div>
            </div>
            <span class="stage-caption" id="stageCaption">Bingkai 09 · Foto penuh</span>
          </div>

          <div class="studio-panel">
            <div class="panel-topline"><span class="tiny-flower" aria-hidden="true">✿</span><span id="progressText">1 foto</span></div>
            <div class="shot-list" id="shotList" aria-label="Kemajuan foto"></div>
            <p class="status" id="status" role="status" aria-live="polite">Pilih bingkai.</p>
            <div class="button-stack">
              <button class="button button-primary" id="openCamera" type="button"><span class="action-icon" aria-hidden="true">▣</span><span id="openCameraLabel">Kamera</span></button>
              <button class="button button-secondary" id="capture" type="button" disabled><span class="action-icon" aria-hidden="true">◉</span><span data-i18n="capture">Ambil</span></button>
              <button class="button button-ghost" id="switchCamera" type="button" hidden><span class="action-icon" aria-hidden="true">⟳</span><span data-i18n="flip">Tukar</span></button>
            </div>
            <div class="fallback">
              <div class="fallback-actions">
                <button class="text-button" id="phoneCamera" type="button"><span aria-hidden="true">▣</span><span data-i18n="phoneCamera">Kamera telefon</span></button>
                <button class="text-button" id="choosePhoto" type="button"><span aria-hidden="true">▧</span><span data-i18n="choosePhoto">Pilih foto</span></button>
              </div>
              <input class="visually-hidden" id="cameraFile" type="file" accept="image/*" capture="user">
              <input class="visually-hidden" id="libraryFile" type="file" accept="image/*">
            </div>
            <div class="finish" id="finish" hidden>
              <div class="finish-heading"><span aria-hidden="true">✓</span><strong>Ready!</strong></div>
              <button class="button button-primary" id="savePhoto" type="button"><span class="action-icon" aria-hidden="true">↓</span><span data-i18n="save">Simpan</span></button>
              <button class="button button-secondary" id="uploadPhoto" type="button" disabled><span class="action-icon" aria-hidden="true">☁</span><span data-i18n="album">Album</span></button>
              <small id="uploadHelp">Drive belum tersedia.</small>
              <button class="text-button restart" id="startOver" type="button"><span aria-hidden="true">↺</span><span>Reset</span></button>
            </div>
          </div>
        </div>
      </section>

    </main>
    <footer><span>Hana & Fiqri</span><small>14.11.2026</small></footer>
  </body>
</html>
